<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>WebSocket 聊天测试</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 20px;
        background: #f5f5f5;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      h2 {
        text-align: center;
        margin-bottom: 16px;
        color: #333;
        font-weight: 500;
        font-size: 22px;
      }

      .chat-container {
        display: flex;
        gap: 20px;
        flex: 1;
        min-height: 0;
      }

      .chat-panel {
        flex: 1;
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #e8e8e8;
      }

      .chat-panel .header {
        padding: 12px 16px;
        font-weight: 600;
        font-size: 15px;
        border-bottom: 1px solid #e8e8e8;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }

      .chat-panel.user1 .header {
        background: #e3f2fd;
        color: #1565c0;
      }

      .chat-panel.user2 .header {
        background: #fce4ec;
        color: #c62828;
      }

      .chat-panel .status-badge {
        font-size: 12px;
        font-weight: 400;
        padding: 2px 10px;
        border-radius: 12px;
        background: #eee;
        color: #666;
      }

      .chat-panel .status-badge.online {
        background: #4caf50;
        color: white;
      }

      .chat-panel .status-badge.offline {
        background: #f44336;
        color: white;
      }

      .chat-panel .messages {
        flex: 1;
        overflow-y: auto;
        padding: 12px 16px;
        background: #fafafa;
        min-height: 0;
      }

      .chat-panel .messages .msg {
        margin: 4px 0 8px 0;
        padding: 8px 12px;
        border-radius: 8px;
        max-width: 85%;
        word-break: break-word;
        font-size: 14px;
        line-height: 1.5;
      }

      .chat-panel .messages .msg-sent {
        background: #e3f2fd;
        color: #0d47a1;
        margin-left: auto;
        text-align: right;
      }

      .chat-panel .messages .msg-received {
        background: #f5f5f5;
        color: #333;
        margin-right: auto;
        text-align: left;
      }

      .chat-panel .messages .msg-system {
        background: transparent;
        color: #999;
        font-size: 12px;
        text-align: center;
        max-width: 100%;
        margin: 4px 0;
      }

      .chat-panel .input-area {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid #e8e8e8;
        background: white;
        flex-shrink: 0;
      }

      .chat-panel .input-area input {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }

      .chat-panel .input-area input:focus {
        border-color: #1976d2;
      }

      .chat-panel .input-area button {
        padding: 8px 18px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
        white-space: nowrap;
      }

      .chat-panel .input-area .btn-send {
        background: #1976d2;
        color: white;
      }

      .chat-panel .input-area .btn-send:hover {
        background: #1565c0;
      }

      .chat-panel .input-area .btn-connect {
        background: #4caf50;
        color: white;
      }

      .chat-panel .input-area .btn-connect:hover {
        background: #388e3c;
      }

      .chat-panel .input-area .btn-disconnect {
        background: #f44336;
        color: white;
      }

      .chat-panel .input-area .btn-disconnect:hover {
        background: #d32f2f;
      }

      .chat-panel .input-area .btn-connect:disabled,
      .chat-panel .input-area .btn-disconnect:disabled,
      .chat-panel .input-area .btn-send:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .chat-panel .input-area .btn-connect:disabled:hover,
      .chat-panel .input-area .btn-disconnect:disabled:hover,
      .chat-panel .input-area .btn-send:disabled:hover {
        background: inherit;
      }

      .chat-panel .user-id-label {
        font-weight: 400;
        color: #666;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <h2>💬 WebSocket 双向聊天测试</h2>

    <div class="chat-container">
      <!-- 用户1 -->
      <div class="chat-panel user1" id="panel1">
        <div class="header">
          <span>👤 用户 <span class="user-id-label">(ID: 1)</span></span>
          <span class="status-badge" id="status1">⚪ 未连接</span>
        </div>
        <div class="messages" id="messages1"></div>
        <div class="input-area">
          <input type="text" id="input1" placeholder="输入消息..." />
          <button class="btn-send" id="send1">发送</button>
          <button class="btn-connect" id="connect1">连接</button>
          <button class="btn-disconnect" id="disconnect1" disabled>断开</button>
        </div>
      </div>

      <!-- 用户2 -->
      <div class="chat-panel user2" id="panel2">
        <div class="header">
          <span>👤 用户 <span class="user-id-label">(ID: 2)</span></span>
          <span class="status-badge" id="status2">⚪ 未连接</span>
        </div>
        <div class="messages" id="messages2"></div>
        <div class="input-area">
          <input type="text" id="input2" placeholder="输入消息..." />
          <button class="btn-send" id="send2">发送</button>
          <button class="btn-connect" id="connect2">连接</button>
          <button class="btn-disconnect" id="disconnect2" disabled>断开</button>
        </div>
      </div>
    </div>

    <script>
      // 每个用户独立 WebSocket 连接
      const users = {
        1: {
          ws: null,
          connected: false,
          messagesEl: document.getElementById("messages1"),
          inputEl: document.getElementById("input1"),
          statusEl: document.getElementById("status1"),
          connectBtn: document.getElementById("connect1"),
          disconnectBtn: document.getElementById("disconnect1"),
          sendBtn: document.getElementById("send1"),
        },
        2: {
          ws: null,
          connected: false,
          messagesEl: document.getElementById("messages2"),
          inputEl: document.getElementById("input2"),
          statusEl: document.getElementById("status2"),
          connectBtn: document.getElementById("connect2"),
          disconnectBtn: document.getElementById("disconnect2"),
          sendBtn: document.getElementById("send2"),
        },
      };

      function appendMessage(userId, text, type = "received") {
        const user = users[userId];
        if (!user) return;
        const div = document.createElement("div");
        div.className = `msg msg-${type}`;
        div.textContent = text;
        user.messagesEl.appendChild(div);
        user.messagesEl.scrollTop = user.messagesEl.scrollHeight;
      }

      function setStatus(userId, text, isOnline = false) {
        const user = users[userId];
        if (!user) return;
        user.statusEl.textContent = text;
        user.statusEl.className = "status-badge" + (isOnline ? " online" : "");
      }

      function connect(userId) {
        const user = users[userId];
        if (user.connected) return;

        const wsUrl = `ws://localhost:8080/im?userID=${userId}`;
        const ws = new WebSocket(wsUrl);

        ws.onopen = function () {
          user.connected = true;
          user.ws = ws;
          setStatus(userId, "✅ 在线", true);
          appendMessage(userId, "系统: 连接成功", "system");
          user.connectBtn.disabled = true;
          user.disconnectBtn.disabled = false;
          user.sendBtn.disabled = false;
          user.inputEl.disabled = false;
          user.inputEl.focus();
        };

        ws.onmessage = function (event) {
          try {
            const data = JSON.parse(event.data);
            // 解析消息内容
            let text = "";
            if (data.elements && data.elements.length > 0) {
              text = data.elements.map((el) => el.content || "").join(" ");
            } else {
              text = event.data;
            }
            const sender =
              data.senderId === userId ? "我" : `用户${data.senderId}`;
            appendMessage(userId, `${sender}: ${text}`, "received");
          } catch (e) {
            appendMessage(userId, `收到: ${event.data}`, "received");
          }
        };

        ws.onclose = function () {
          user.connected = false;
          user.ws = null;
          setStatus(userId, "❌ 已断开", false);
          appendMessage(userId, "系统: 连接已断开", "system");
          user.connectBtn.disabled = false;
          user.disconnectBtn.disabled = true;
          user.sendBtn.disabled = true;
          user.inputEl.disabled = true;
        };

        ws.onerror = function (error) {
          appendMessage(userId, "系统: 连接错误，请检查服务是否启动", "system");
          console.error(`用户${userId} WebSocket错误:`, error);
          ws.close();
        };
      }

      function disconnect(userId) {
        const user = users[userId];
        if (user.ws) {
          user.ws.close();
          user.ws = null;
        }
        user.connected = false;
        setStatus(userId, "⚪ 已断开", false);
        user.connectBtn.disabled = false;
        user.disconnectBtn.disabled = true;
        user.sendBtn.disabled = true;
        user.inputEl.disabled = true;
        appendMessage(userId, "系统: 手动断开", "system");
      }

      function sendMessage(userId) {
        const user = users[userId];
        if (!user.connected || !user.ws) {
          appendMessage(userId, "系统: 请先连接", "system");
          return;
        }

        const content = user.inputEl.value.trim();
        if (!content) {
          appendMessage(userId, "系统: 请输入内容", "system");
          return;
        }

        const receiverId = userId === 1 ? 2 : 1;
        const payload = {
          senderId: userId,
          receiverId: receiverId,
          elements: [{ type: 1, content: content }],
          timestamp: Date.now(),
        };

        user.ws.send(JSON.stringify(payload));
        appendMessage(userId, `我: ${content}`, "sent");
        user.inputEl.value = "";
        user.inputEl.focus();
      }

      // 绑定事件（用户1）
      document
        .getElementById("connect1")
        .addEventListener("click", function () {
          connect(1);
        });
      document
        .getElementById("disconnect1")
        .addEventListener("click", function () {
          disconnect(1);
        });
      document.getElementById("send1").addEventListener("click", function () {
        sendMessage(1);
      });
      document
        .getElementById("input1")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter") sendMessage(1);
        });

      // 绑定事件（用户2）
      document
        .getElementById("connect2")
        .addEventListener("click", function () {
          connect(2);
        });
      document
        .getElementById("disconnect2")
        .addEventListener("click", function () {
          disconnect(2);
        });
      document.getElementById("send2").addEventListener("click", function () {
        sendMessage(2);
      });
      document
        .getElementById("input2")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter") sendMessage(2);
        });

      // 初始状态
      [1, 2].forEach((id) => {
        const user = users[id];
        user.sendBtn.disabled = true;
        user.inputEl.disabled = true;
        user.inputEl.placeholder = "请先连接";
        appendMessage(id, "系统: 点击「连接」按钮建立连接", "system");
      });
    </script>
  </body>
</html>
